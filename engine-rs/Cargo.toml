[package]
name = "basalt-engine"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Basalt's Minecraft Java Edition launch engine: manifest parsing, library rules, classpath, memory/GC policy, argument assembly, exec strategy."

[lib]
name = "basalt_engine"
crate-type = ["lib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = { version = "0.21", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
