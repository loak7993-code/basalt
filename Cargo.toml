[workspace]
resolver = "2"
members = ["engine-rs", "cli"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# The Android cdylib builds use this profile too; engine-rs size tuning lives
# here because Cargo ignores profiles in non-root members.
[profile.basalt-android]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
