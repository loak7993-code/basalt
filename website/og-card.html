<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Geist";
        src: url("/fonts/Geist-Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Geist";
        src: url("/fonts/Geist-Medium.ttf") format("truetype");
        font-weight: 500;
      }
      @font-face {
        font-family: "Geist";
        src: url("/fonts/Geist-SemiBold.ttf") format("truetype");
        font-weight: 600;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("/fonts/GeistMono-Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("/fonts/GeistMono-Medium.ttf") format("truetype");
        font-weight: 500;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #050505;
        color: #fafafa;
        font-family: "Geist", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
      }
      .haze {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(680px circle at 88% 8%, rgba(77, 158, 255, 0.16), transparent 62%),
          radial-gradient(520px circle at 4% 96%, rgba(77, 158, 255, 0.07), transparent 60%);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 18px;
        position: relative;
      }
      .word {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .eyebrow {
        font-family: "Geist Mono", monospace;
        font-size: 17px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #4d9eff;
        position: relative;
      }
      h1 {
        font-size: 74px;
        line-height: 1.04;
        letter-spacing: -0.035em;
        font-weight: 600;
        margin: 0;
        max-width: 900px;
        position: relative;
      }
      h1 span {
        color: #a1a1aa;
      }
      .foot {
        display: flex;
        gap: 28px;
        font-family: "Geist Mono", monospace;
        font-size: 18px;
        color: #71717a;
        position: relative;
      }
      .foot b {
        color: #fafafa;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="haze"></div>
    <div class="row">
      <svg width="52" height="52" viewBox="0 0 108 108">
        <rect width="108" height="108" rx="22" fill="#0A0A0C" />
        <path d="M36,58 46,54 46,72 36,72 Z M34,74.5 74,74.5 74,76.5 34,76.5 Z" fill="#2E6FC7" />
        <path d="M48,44 58,40 58,72 48,72 Z" fill="#4D9EFF" />
        <path d="M60,56 70,52 70,72 60,72 Z" fill="#2E6FC7" />
      </svg>
      <span class="word">Basalt</span>
    </div>
    <h1>Minecraft Java Edition,<br /><span>launched by Rust.</span></h1>
    <div class="foot">
      <span><b>Android</b> arm64 + universal</span>
      <span><b>Linux</b> AppImage</span>
      <span><b>MC 26.3</b> Java 25</span>
      <span><b>GPL-3</b> fork of ZalithLauncher 2</span>
    </div>
  </body>
</html>
