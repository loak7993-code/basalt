[package]
name = "basalt-cli"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Basalt launcher for Linux: install and play Minecraft Java Edition from the official manifests, offline accounts first."

[[bin]]
name = "basalt"
path = "src/main.rs"

[[bin]]
name = "basalt-gui"
path = "src/bin/basalt-gui.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
basalt-engine = { path = "../engine-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
sha1_smol = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
